spring.application.name=rooftop-delivery

# Default datasource is in-memory H2 in MySQL compatibility mode, so the service starts
# with no database installed. The schema below is the same file MySQL uses.
#spring.datasource.url=jdbc:h2:mem:rooftop;MODE=MySQL;DB_CLOSE_DELAY=-1
#spring.datasource.username=sa
#spring.datasource.password=

# To run against MySQL, comment out the three lines above and uncomment these.
spring.datasource.url=jdbc:mysql://localhost:3306/rooftop?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# The schema is owned by schema.sql, not generated by Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always

springdoc.swagger-ui.path=/swagger-ui.html
